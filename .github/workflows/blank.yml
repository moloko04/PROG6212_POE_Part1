name: .NET Build and Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore RaceDay.API.sln

    - name: Build the solution
      run: dotnet build RaceDay.API.sln --no-restore --configuration Release

    - name: Run tests
      run: dotnet test RaceDay.API.sln --no-build --configuration Release --verbosity normal
