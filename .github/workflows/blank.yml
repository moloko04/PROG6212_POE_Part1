name: .NET Build and Tests

on:
  push:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Build API
      run: dotnet build RaceDay.API.csproj --configuration Release

    - name: Build MVC Web
      run: dotnet build RaceDay.Web/RaceDay.Web.csproj --configuration Release
