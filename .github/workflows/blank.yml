name: .NET CI

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
        
    - name: Build Main API
      run: dotnet build RaceDay.API.csproj
      
    - name: Build Web App
      run: dotnet build RaceDay.Web/RaceDay.Web.csproj
