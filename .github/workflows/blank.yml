name: .NET Build and Tests

on:
  push:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
        
    - name: Build and Test API and Web
      run: |
        echo "Building Root Project..."
        dotnet build *.csproj --configuration Release
        
        echo "Building Web Project..."
        dotnet build RaceDay.Web/RaceDay.Web.csproj --configuration Release
        
        echo "Running Tests..."
        dotnet test RaceDay.API.Tests/RaceDay.API.Tests.csproj --configuration Release
