name: .NET Build and Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore RaceDay.API/RaceDay.API.csproj

    - name: Build API
      run: dotnet build RaceDay.API/RaceDay.API.csproj --no-restore --configuration Release

    - name: Build MVC Web
      run: dotnet build RaceDay.Web/RaceDay.Web.csproj --no-restore --configuration Release

    - name: Run Tests
      run: dotnet test RaceDay.API.Tests/RaceDay.API.Tests.csproj --no-build --configuration Release --verbosity normal
